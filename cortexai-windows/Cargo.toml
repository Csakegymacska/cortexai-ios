[package]
name = "cortexai"
version = "1.0.0"
edition = "2021"
description = "Cortex AI for Windows — the CortexAnime AI, native"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
