name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cortexai-windows/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cortexai-windows -> target

      - name: Build
        run: cargo build --release
        working-directory: cortexai-windows

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item cortexai-windows/target/release/cortexai.exe out/CortexAI-1.0-windows.exe
          Get-FileHash out/CortexAI-1.0-windows.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  CortexAI-1.0-windows.exe" } |
            Out-File -Encoding ascii out/CortexAI-1.0-windows.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CortexAI-windows
          path: out/
