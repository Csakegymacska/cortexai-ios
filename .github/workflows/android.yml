name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cortexai-android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias cortex \
            -storepass cortexport -keypass cortexport \
            -dname "CN=Cortex AI, O=OmegaTech x CortexAnime, C=HU"
        env:
          ANDROID_KEYSTORE: /tmp/release.jks
          ANDROID_KEYSTORE_PASSWORD: cortexport
          ANDROID_KEY_ALIAS: cortex
          ANDROID_KEY_PASSWORD: cortexport

      - name: Build APK
        run: gradle assembleRelease --no-daemon
        working-directory: cortexai-android
        env:
          ANDROID_KEYSTORE: /tmp/release.jks
          ANDROID_KEYSTORE_PASSWORD: cortexport
          ANDROID_KEY_ALIAS: cortex
          ANDROID_KEY_PASSWORD: cortexport

      - name: Package
        run: |
          mkdir -p out
          cp cortexai-android/app/build/outputs/apk/release/app-release.apk out/CortexAI-1.0-android.apk
          cd out && sha256sum CortexAI-1.0-android.apk > CortexAI-1.0-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CortexAI-android
          path: out/

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: CortexAI-android
          path: out

      - name: Boot emulator and capture real screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r out/CortexAI-1.0-android.apk; mkdir -p shots; for tab in Chat Images Live Anime Profile; do adb shell am start -W -n eu.cortex.ai/.MainActivity --es screen $tab; sleep 9; adb exec-out screencap -p > shots/android-$tab.png; adb shell am force-stop eu.cortex.ai; done

      - uses: actions/upload-artifact@v4
        with:
          name: CortexAI-android-shots
          path: shots/
